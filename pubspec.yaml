name: fllamer
description: Mobile-first local llama.cpp inference, embeddings, RAG, multimodal, LoRA, and speculative decoding for Dart and Flutter.
version: 0.2.0

repository: https://github.com/ProjectKokage/fllamer
topics:
  - ffi
  - llama-cpp
  - local-ai
  - rag

environment:
  sdk: ^3.11.5

dependencies:
  code_assets: ^1.2.1
  crypto: ^3.0.7
  ffi: ^2.2.0
  hooks: ^2.0.2

dev_dependencies:
  ffigen: ^20.1.1
  lints: ^6.0.0
  test: ^1.25.6

# Flutter collects these vendored native notices into its generated NOTICES
# bundle. This section does not add a Flutter runtime dependency.
flutter:
  licenses:
    - third_party/llama.cpp/LICENSE
    - third_party/llama.cpp/AUTHORS
    - third_party/llama.cpp/licenses/LICENSE-jsonhpp
    - third_party/llama.cpp/licenses/LICENSE-miniaudio
    - third_party/llama.cpp/licenses/LICENSE-stb
    - third_party/llama.cpp/vendor/cpp-httplib/LICENSE
