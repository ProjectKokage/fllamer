name: fllamer
description: Mobile-first local llama.cpp inference, embeddings, RAG, multimodal, LoRA, and speculative decoding for Dart and Flutter.
version: 0.4.0

repository: https://github.com/ProjectKokage/fllamer
topics:
  - ffi
  - llama-cpp
  - local-ai
  - rag

environment:
  sdk: ^3.11.5

dependencies:
  code_assets: ^2.0.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  hooks: ^2.2.0

dev_dependencies:
  ffigen: ^20.1.1
  lints: ^6.0.0
  test: ^1.25.6

# Flutter appends these copies of the pinned native notices to its generated
# NOTICES bundle; tool/flutter_notices.dart writes them with the names each
# covers. This section does not add a Flutter runtime dependency.
flutter:
  licenses:
    - third_party/flutter_notices/llama.cpp.txt
    - third_party/flutter_notices/llama.cpp-authors.txt
    - third_party/flutter_notices/nlohmann-json.txt
    - third_party/flutter_notices/cpp-httplib.txt
    - third_party/flutter_notices/rotate-bits.txt
    - third_party/flutter_notices/sha256.txt
    - third_party/flutter_notices/xxhash.txt
    - third_party/flutter_notices/miniaudio.txt
    - third_party/flutter_notices/stb_image.txt
    - third_party/flutter_notices/vulkan-headers.txt
